name: Build & Deploy DuckShell Plugins

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 阶段 1：安全扫描 & 解析变更的插件及其 config.json
  # =========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      plugins_json: ${{ steps.discover.outputs.plugins_json }}
      has_plugins: ${{ steps.discover.outputs.has_plugins }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Security Check & Discover Plugins
        id: discover
        shell: python
        run: |
          import os, re, json

          forbidden_exts = {'.exe', '.dll', '.so', '.lib', '.a', '.dylib', '.bat', '.cmd', '.ps1', '.sh', '.vbs'}
          dangerous_patterns = [
              r'\bCreateProcess[AW]?\s*\(',
              r'\bShellExecute[AW]?\s*\(',
              r'\bWinExec\s*\(',
              r'\bsystem\s*\(',
              r'\bpopen\s*\(',
              r'\bfork\s*\(',
              r'\bexec[lv][pe]?\s*\(',
              r'\bURLDownloadToFile[AW]?\s*\(',
              r'\bRegSetValue',
              r'\bRegCreateKey'
          ]

          plugins = []
          if not os.path.exists('src'):
              print("No src directory found.")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("has_plugins=false\n")
                  f.write("plugins_json=[]\n")
              exit(0)

          for plugin_dir in sorted(os.listdir('src')):
              full_dir = os.path.join('src', plugin_dir)
              if not os.path.isdir(full_dir):
                  continue

              config_path = os.path.join(full_dir, 'config.json')
              if not os.path.isfile(config_path):
                  raise RuntimeError(f"❌ 缺少配置文件: {config_path}")

              with open(config_path, 'r', encoding='utf-8') as cf:
                  cfg = json.load(cf)

              if not isinstance(cfg, dict):
                  raise RuntimeError(f"❌ {config_path} 必须是 JSON 对象")

              plat_cfg = cfg.get('platforms')
              if not isinstance(plat_cfg, dict):
                  raise RuntimeError(f"❌ {plugin_dir}/config.json 中的 platforms 必须是对象，例如 {{\"windows\": true, \"linux\": true, \"macos\": true}}")

              enabled_platforms = [
                  k.lower() for k, v in plat_cfg.items()
                  if isinstance(v, bool) and v is True
              ]
              if not enabled_platforms:
                  raise RuntimeError(f"❌ {plugin_dir}/config.json 中至少需要启用一个平台 (true)")

              for root, _, files in os.walk(full_dir):
                  for fname in files:
                      ext = os.path.splitext(fname)[1].lower()
                      fpath = os.path.join(root, fname)
                      if ext in forbidden_exts:
                          raise RuntimeError(f"❌ 禁止提交二进制或脚本文件: {fpath}")

                      if fname.lower() in {'duck_sdk.h', 'sdk.h', 'plugin_sdk.h'}:
                          raise RuntimeError(f"❌ 请勿在插件目录中包含 SDK 头文件 ({fpath})，CI 会自动注入官方 SDK")

                      if ext in {'.c', '.cpp', '.cc', '.cxx', '.h', '.hpp'}:
                          with open(fpath, 'r', encoding='utf-8', errors='ignore') as sf:
                              content = sf.read()
                          for pat in dangerous_patterns:
                              if re.search(pat, content):
                                  raise RuntimeError(f"❌ 检测到高风险系统调用 ({pat}) 位于: {fpath}")

              plugins.append({
                  "dir": plugin_dir,
                  "id": cfg.get("id", plugin_dir.lower()),
                  "name": cfg.get("name", plugin_dir),
                  "version": cfg.get("latest_version", cfg.get("version", "v1.0")),
                  "platforms": enabled_platforms,
                  "manifest": cfg
              })

          print("Discovered valid plugins:", json.dumps(plugins, indent=2, ensure_ascii=False))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"has_plugins={'true' if plugins else 'false'}\n")
              f.write(f"plugins_json={json.dumps(plugins)}\n")

  # =========================================================================
  # 阶段 2A：Windows 编译 (MSVC cl.exe -> plugin.dll)
  # =========================================================================
  build-windows:
    needs: prepare
    if: needs.prepare.outputs.has_plugins == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Windows Plugins (.dll)
        shell: pwsh
        env:
          PLUGINS_JSON: ${{ needs.prepare.outputs.plugins_json }}
        run: |
          $plugins = $env:PLUGINS_JSON | ConvertFrom-Json
          $sdkDir = (Resolve-Path "sdk").Path
          $sdkHeader = (Get-ChildItem -Path $sdkDir -Filter "*.h*" | Select-Object -First 1).FullName
          $sdkLibs = (Get-ChildItem -Path $sdkDir -Filter "*.lib" | ForEach-Object { "`"$($_.FullName)`"" }) -join " "

          New-Item -ItemType Directory -Force -Path "build_out/windows" | Out-Null

          foreach ($p in $plugins) {
              if ($p.platforms -notcontains "windows") {
                  Write-Host "⏭️ 跳过 $($p.dir) (未启用 windows)"
                  continue
              }

              Write-Host "🔨 正在编译 Windows 插件: $($p.dir)"
              $srcRoot = (Resolve-Path "src/$($p.dir)").Path
              $workDir = Join-Path $env:RUNNER_TEMP "win_$($p.dir)"
              New-Item -ItemType Directory -Force -Path $workDir | Out-Null
              Copy-Item -Path "$srcRoot/*" -Destination $workDir -Recurse -Force

              $cppFiles = Get-ChildItem -Path $workDir -Recurse -Filter "*.cpp"
              if ($cppFiles.Count -eq 0) {
                  throw "❌ $($p.dir) 中未找到任何 .cpp 文件"
              }

              Get-ChildItem -Path $workDir -Recurse -Include *.cpp,*.c,*.h,*.hpp | ForEach-Object {
                  $txt = Get-Content $_.FullName -Raw
                  $txt = $txt -replace '#include\s+"[^"]*(duck_sdk|plugin_sdk|sdk)\.h(pp)?"', "#include `"$(Split-Path $sdkHeader -Leaf)`""
                  Set-Content -Path $_.FullName -Value $txt -NoNewline
              }

              $incFlags = @("/I`"$sdkDir`"", "/I`"$workDir`"")
              Get-ChildItem -Path $workDir -Recurse -Directory | ForEach-Object {
                  $incFlags += "/I`"$($_.FullName)`""
              }

              $outDir = "build_out/windows/$($p.dir)"
              New-Item -ItemType Directory -Force -Path $outDir | Out-Null
              $outDll = (Resolve-Path $outDir).Path + "\plugin.dll"

              $cppArgs = ($cppFiles | ForEach-Object { "`"$($_.FullName)`"" }) -join " "
              $cmd = "cl.exe /nologo /LD /O2 /EHsc /std:c++17 /utf-8 /FI`"$sdkHeader`" $($incFlags -join ' ') $cppArgs /Fe:`"$outDll`" /link $sdkLibs"
              Write-Host "Running: $cmd"
              Invoke-Expression $cmd
              if ($LASTEXITCODE -ne 0) { throw "❌ 编译失败: $($p.dir)" }
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: build_out/windows/
          if-no-files-found: ignore

  # =========================================================================
  # 阶段 2B：Linux 编译 (g++ -> plugin.so)
  # =========================================================================
  build-linux:
    needs: prepare
    if: needs.prepare.outputs.has_plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Linux Plugins (.so)
        shell: python
        env:
          PLUGINS_JSON: ${{ needs.prepare.outputs.plugins_json }}
        run: |
          import os, re, glob, json, shutil, subprocess

          plugins = json.loads(os.environ['PLUGINS_JSON'])
          sdk_dir = os.path.abspath('sdk')
          sdk_headers = glob.glob(os.path.join(sdk_dir, '*.h*'))
          if not sdk_headers:
              raise RuntimeError("❌ sdk/ 目录下未找到头文件")
          sdk_header = sdk_headers[0]
          sdk_header_name = os.path.basename(sdk_header)
          sdk_sos = glob.glob(os.path.join(sdk_dir, '*.so*')) + glob.glob(os.path.join(sdk_dir, '*.a'))

          os.makedirs('build_out/linux', exist_ok=True)

          for p in plugins:
              if 'linux' not in p['platforms']:
                  print(f"⏭️ 跳过 {p['dir']} (未启用 linux)")
                  continue

              print(f"🔨 正在编译 Linux 插件: {p['dir']}")
              src_root = os.path.abspath(os.path.join('src', p['dir']))
              work_dir = os.path.join('/tmp', f"linux_{p['dir']}")
              if os.path.exists(work_dir):
                  shutil.rmtree(work_dir)
              shutil.copytree(src_root, work_dir)

              cpp_files = []
              inc_dirs = [f"-I{sdk_dir}", f"-I{work_dir}"]
              for root, dirs, files in os.walk(work_dir):
                  for d in dirs:
                      inc_dirs.append(f"-I{os.path.join(root, d)}")
                  for f in files:
                      fpath = os.path.join(root, f)
                      ext = os.path.splitext(f)[1].lower()
                      if ext in {'.cpp', '.c', '.h', '.hpp'}:
                          with open(fpath, 'r', encoding='utf-8', errors='ignore') as sf:
                              txt = sf.read()
                          txt = re.sub(r'#include\s+"[^"]*(duck_sdk|plugin_sdk|sdk)\.h(pp)?"', f'#include "{sdk_header_name}"', txt)
                          with open(fpath, 'w', encoding='utf-8') as sf:
                              sf.write(txt)
                      if ext == '.cpp':
                          cpp_files.append(fpath)

              if not cpp_files:
                  raise RuntimeError(f"❌ {p['dir']} 中未找到任何 .cpp 文件")

              out_dir = os.path.abspath(os.path.join('build_out/linux', p['dir']))
              os.makedirs(out_dir, exist_ok=True)
              out_so = os.path.join(out_dir, 'plugin.so')

              cmd = [
                  'g++', '-shared', '-fPIC', '-O2', '-std=c++17',
                  '-include', sdk_header,
                  *inc_dirs,
                  *cpp_files,
                  *sdk_sos,
                  '-Wl,-rpath,$ORIGIN',
                  '-o', out_so
              ]
              print("Running:", " ".join(cmd))
              subprocess.run(cmd, check=True)

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: build_out/linux/
          if-no-files-found: ignore

  # =========================================================================
  # 阶段 2C：macOS 编译 (Apple clang++ -> plugin.dylib)
  # =========================================================================
  build-macos:
    needs: prepare
    if: needs.prepare.outputs.has_plugins == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile macOS Plugins (.dylib)
        shell: python3
        env:
          PLUGINS_JSON: ${{ needs.prepare.outputs.plugins_json }}
        run: |
          import os, re, glob, json, shutil, subprocess

          plugins = json.loads(os.environ['PLUGINS_JSON'])
          sdk_dir = os.path.abspath('sdk')
          sdk_headers = glob.glob(os.path.join(sdk_dir, '*.h*'))
          if not sdk_headers:
              raise RuntimeError("❌ sdk/ 目录下未找到头文件")
          sdk_header = sdk_headers[0]
          sdk_header_name = os.path.basename(sdk_header)
          sdk_libs = glob.glob(os.path.join(sdk_dir, '*.dylib')) + glob.glob(os.path.join(sdk_dir, '*.a'))

          os.makedirs('build_out/macos', exist_ok=True)

          for p in plugins:
              if 'macos' not in p['platforms']:
                  print(f"⏭️ 跳过 {p['dir']} (未启用 macos)")
                  continue

              print(f"🔨 正在编译 macOS 插件: {p['dir']}")
              src_root = os.path.abspath(os.path.join('src', p['dir']))
              work_dir = os.path.join('/tmp', f"macos_{p['dir']}")
              if os.path.exists(work_dir):
                  shutil.rmtree(work_dir)
              shutil.copytree(src_root, work_dir)

              cpp_files = []
              inc_dirs = [f"-I{sdk_dir}", f"-I{work_dir}"]
              for root, dirs, files in os.walk(work_dir):
                  for d in dirs:
                      inc_dirs.append(f"-I{os.path.join(root, d)}")
                  for f in files:
                      fpath = os.path.join(root, f)
                      ext = os.path.splitext(f)[1].lower()
                      if ext in {'.cpp', '.c', '.h', '.hpp'}:
                          with open(fpath, 'r', encoding='utf-8', errors='ignore') as sf:
                              txt = sf.read()
                          txt = re.sub(r'#include\s+"[^"]*(duck_sdk|plugin_sdk|sdk)\.h(pp)?"', f'#include "{sdk_header_name}"', txt)
                          with open(fpath, 'w', encoding='utf-8') as sf:
                              sf.write(txt)
                      if ext == '.cpp':
                          cpp_files.append(fpath)

              if not cpp_files:
                  raise RuntimeError(f"❌ {p['dir']} 中未找到任何 .cpp 文件")

              out_dir = os.path.abspath(os.path.join('build_out/macos', p['dir']))
              os.makedirs(out_dir, exist_ok=True)
              out_dylib = os.path.join(out_dir, 'plugin.dylib')

              cmd = [
                  'clang++', '-dynamiclib', '-fPIC', '-O2', '-std=c++17',
                  '-include', sdk_header,
                  *inc_dirs,
                  *cpp_files,
                  *sdk_libs,
                  '-Wl,-rpath,@loader_path',
                  '-o', out_dylib
              ]
              print("Running:", " ".join(cmd))
              subprocess.run(cmd, check=True)

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: build_out/macos/
          if-no-files-found: ignore

  # =========================================================================
  # 阶段 3：打包 dist/ 目录、生成 SHA-256 与 index.html，并自动提交触发 Netlify
  # =========================================================================
  package-and-deploy:
    needs: [prepare, build-windows, build-linux, build-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.has_plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: artifacts/windows
        continue-on-error: true

      - name: Download Linux Binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: artifacts/linux
        continue-on-error: true

      - name: Download macOS Binaries
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: artifacts/macos
        continue-on-error: true

      - name: Generate dist/ Structure (plugin.json & metadata/index.html)
        shell: python
        env:
          PLUGINS_JSON: ${{ needs.prepare.outputs.plugins_json }}
        run: |
          import os, json, shutil, hashlib, copy

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(8192), b''):
                      h.update(chunk)
              return h.hexdigest()

          plugins = json.loads(os.environ['PLUGINS_JSON'])

          if os.path.exists('dist'):
              shutil.rmtree('dist')
          os.makedirs('dist/metadata', exist_ok=True)
          os.makedirs('dist/plugins', exist_ok=True)

          index_links = []

          for p in plugins:
              pdir = p['dir']
              target_dir = os.path.join('dist/plugins', pdir)
              os.makedirs(target_dir, exist_ok=True)

              meta = copy.deepcopy(p.get('manifest', {}))
              meta.setdefault('id', p['id'])
              meta.setdefault('name', p['name'])
              meta.setdefault('latest_version', p['version'])

              win_dll = os.path.join('artifacts/windows', pdir, 'plugin.dll')
              if 'windows' in p['platforms'] and os.path.isfile(win_dll):
                  dst_dll = os.path.join(target_dir, 'plugin.dll')
                  shutil.copy2(win_dll, dst_dll)
                  win_obj = meta.get('windows') if isinstance(meta.get('windows'), dict) else {}
                  win_obj['file'] = 'plugin.dll'
                  win_obj['sha256'] = sha256_file(dst_dll)
                  meta['windows'] = win_obj
              else:
                  meta.pop('windows', None)

              linux_so = os.path.join('artifacts/linux', pdir, 'plugin.so')
              if 'linux' in p['platforms'] and os.path.isfile(linux_so):
                  dst_so = os.path.join(target_dir, 'plugin.so')
                  shutil.copy2(linux_so, dst_so)
                  linux_obj = meta.get('linux') if isinstance(meta.get('linux'), dict) else {}
                  linux_obj['file'] = 'plugin.so'
                  linux_obj['sha256'] = sha256_file(dst_so)
                  meta['linux'] = linux_obj
              else:
                  meta.pop('linux', None)

              macos_dylib = os.path.join('artifacts/macos', pdir, 'plugin.dylib')
              if 'macos' in p['platforms'] and os.path.isfile(macos_dylib):
                  dst_dylib = os.path.join(target_dir, 'plugin.dylib')
                  shutil.copy2(macos_dylib, dst_dylib)
                  macos_obj = meta.get('macos') if isinstance(meta.get('macos'), dict) else {}
                  macos_obj['file'] = 'plugin.dylib'
                  macos_obj['sha256'] = sha256_file(dst_dylib)
                  meta['macos'] = macos_obj
              else:
                  meta.pop('macos', None)

              with open(os.path.join(target_dir, 'plugin.json'), 'w', encoding='utf-8') as jf:
                  json.dump(meta, jf, indent=2, ensure_ascii=False)

              index_links.append(f'    <li><a href="/plugins/{pdir}/">{meta["name"]} ({meta["latest_version"]})</a></li>')

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>DuckShell Plugin Registry</title>
          </head>
          <body>
            <h1>DuckShell Plugin Registry</h1>
            <ul>
          {chr(10).join(index_links)}
            </ul>
          </body>
          </html>
          """
          with open('dist/metadata/index.html', 'w', encoding='utf-8') as hf:
              hf.write(html)

      - name: Commit and Push dist/ to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes in dist/ to commit."
          else
            git commit -m "chore(registry): update compiled plugins in dist/ [skip ci]"
            git push
          fi